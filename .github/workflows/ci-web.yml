name: Web CI (lint, test, build)

# Lint, test and build the SPA on a GitHub-hosted Linux runner.
#
# This job exists because nothing was running any of these three commands.
# The checks on this repo were licenses, PR hygiene, gitleaks and actionlint,
# so a pull request could be green with a main that did not compile -- which
# is exactly what happened in #98 and was only found when the 1670 FleetOS
# host could not be rebuilt (#99).
#
# All three are run, not just one of them, because each catches what the
# others miss: `vitest run` does not typecheck, and `tsc -b` runs only inside
# `npm run build`, so a type error in a test file passes the test suite and
# fails the production build.

# Pull requests only, and not while the PR is a draft. There is no run on push
# to main: the squash merge lands the tree the PR run already tested.
#
# Skip when a change touches only Markdown or issue templates. A mixed change
# still runs, since paths-ignore only skips when every changed file matches.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

# One run per PR per workflow: a new push cancels the older PR run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web-validation:
    name: Web validation (lint, test, build)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22 LTS. The repo declares no `engines` range, so this pin is the
          # only statement of what version the project is expected to build
          # on; if that ever needs to change, change it here on purpose.
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `npm ci` rather than `npm install`: it installs exactly the lockfile
        # and fails if package.json and the lockfile disagree, so CI cannot
        # quietly pass against a dependency tree no one else has.
        run: npm ci

      - name: Install buf
        # The generated-stubs check below regenerates packages/api-client with
        # buf. The release binary is checked against the SHA-256 its release
        # publishes (sha256.txt); bump both together.
        env:
          BUF_VERSION: 1.73.0
          BUF_SHA256: 8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -sSfL -o "$bin/buf" \
            "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "${BUF_SHA256}  $bin/buf" | sha256sum -c -
          chmod +x "$bin/buf"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Lint
        run: npm run lint

      - name: Release bundle check's own tests
        # scripts/ is plain Node, outside the npm workspaces the Test step
        # below covers, so its node:test suite gets its own step.
        run: node --test scripts/*.test.mjs

      - name: Test
        run: npm run test

      - name: Build
        # tsc -b then vite build. This is the step that #99 was about.
        run: npm run build

      - name: Release bundle has no development-only code
        # The existing Build step above builds without DEV_UI_ISSUE_COPY or
        # VITE_FLEET_MODE, so its output is the release build.
        run: node scripts/check-release-bundle.mjs apps/console/dist

      - name: Icons match their sources
        run: npm -w @cryptos-pki/ui run generate:icons && git diff --exit-code packages/ui/src/icons

      - name: No embedded design-tool metadata
        # A plain `grep -r ... packages apps/console/public` fails outright
        # (exit 2, not 1) while apps/console/public doesn't exist yet, which
        # `!` would silently turn into a false pass. `find` with a missing
        # starting path is no better under this shell's `-eo pipefail`: find
        # itself exits 1 when one of its starting points doesn't exist, which
        # aborts the step before the hits check ever runs -- so the directory
        # list is built from only the paths that exist first. gen-icons.mjs
        # and icons.test.tsx are the only files allowed to say "c2pa" --
        # stripping and checking for it is the whole point of both -- so
        # they're excluded by name; any other hit is a real embedded manifest.
        # GNU find also propagates a non-zero exit from `-exec ... +` itself,
        # and grep exits 1 on the normal, clean case where nothing matches --
        # `|| true` keeps that from aborting the step under `-e`; the actual
        # verdict is the $hits check below.
        run: |
          dirs=()
          for d in packages apps/console/public; do
            [ -d "$d" ] && dirs+=("$d")
          done
          hits="$(find "${dirs[@]}" -type f \
            ! -path '*/node_modules/*' ! -name gen-icons.mjs ! -name icons.test.tsx \
            -exec grep -lI -i c2pa {} + || true)"
          if [ -n "$hits" ]; then
            echo "$hits" >&2
            exit 1
          fi

      - name: Generated stubs match the pinned protos
        # git status rather than git diff, so a newly generated file counts as
        # stale too instead of passing as untracked.
        run: |
          npm run generate
          stale="$(git status --porcelain packages/api-client/src/gen)"
          if [ -n "$stale" ]; then
            echo "packages/api-client/src/gen is out of date. Run 'npm run generate' and commit the result." >&2
            echo "$stale" >&2
            exit 1
          fi

      - name: Check tree is clean
        # A formatter or a generated file that rewrites something in place
        # would otherwise pass here and surprise the next person.
        run: git diff --exit-code
