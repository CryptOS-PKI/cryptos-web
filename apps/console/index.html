<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      connect-src allows localhost/127.0.0.1 (http + ws) so `live` mode can
      fetch the local dev manager (VITE_FLEET_API) and vite HMR keeps working.
      This is a local-dev allowance only -- production (`live-auth`, same
      origin) should tighten connect-src back to 'self'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*"
    />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="/favicon-32.png" rel="icon" sizes="32x32" type="image/png" />
    <link href="/favicon-16.png" rel="icon" sizes="16x16" type="image/png" />
    <link href="/favicon.ico" rel="alternate icon" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
    <link href="/site.webmanifest" rel="manifest" />
    <meta content="#0C0F16" name="theme-color" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FleetOS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
